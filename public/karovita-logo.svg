<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 180" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="karoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1d68f0"/>
      <stop offset="100%" stop-color="#38b6ff"/>
    </linearGradient>
    <linearGradient id="arrowGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#1e6af1"/>
      <stop offset="100%" stop-color="#46c0ff"/>
    </linearGradient>
  </defs>

  <!-- K Icon with Upward Arrow -->
  <g id="k-symbol">
    <!-- Arrow Stem -->
    <path d="M402 36 L434 36 L434 140 L402 140 Z" fill="url(#karoGrad)"/>
    <!-- Arrow Head Triangle -->
    <path d="M418 10 L444 38 L392 38 Z" fill="url(#arrowGrad)"/>
    <!-- Upper Diagonal Leg -->
    <path d="M428 82 L478 22 L514 22 L454 90 Z" fill="url(#karoGrad)"/>
    <!-- Lower Diagonal Leg -->
    <path d="M446 88 L514 154 L476 154 L420 98 Z" fill="url(#karoGrad)"/>
  </g>

  <!-- Persian Typographic Word "کارویتا" styled to match logo -->
  <g fill="#216bf2" font-family="'Vazirmatn', 'Tahoma', 'Segoe UI', sans-serif" font-weight="900">
    <text x="375" y="128" font-size="124" text-anchor="end" letter-spacing="-3">کارویتا</text>
  </g>
</svg>
